<!DOCTYPE html>
<html>
<head>
    <title>Dog Jump Game</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364); /* dark gradient */
            text-align: center;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #f1f1f1;
        }
        canvas {
            background: #2b2b2b; /* slightly lighter dark canvas */
            border: 3px solid #f1f1f1;
            display: block;
            margin: 20px auto;
            max-width: 95vw;
            height: auto;
        }
    </style>
</head>
<body>
    <h1>Dog Jump Game 🐶</h1>
    <canvas id="gameCanvas" width="900" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let dogImg = new Image();
        dogImg.src = "https://i.ibb.co/7zjFJ0x/dog.png"; // dog sprite

        let dog, obstacles, score, gameOver, gameSpeed;
        let animationId = null;

        function initGame() {
            if (animationId) cancelAnimationFrame(animationId);
            dog = { 
                x: 50, 
                y: 320, 
                width: 60, 
                height: 60, 
                dy: 0, 
                jumpPower: -18,  // jump power बढ़ा दिया (पहले -15 था)
                gravity: 0.7,    // gravity थोड़ी smooth रखी
                rotation: 0      // aesthetic rotation effect
            };
            obstacles = [];
            score = 0;
            gameOver = false;
            gameSpeed = 6;
            update();
        }

        function drawGround() {
            ctx.strokeStyle = "#f1f1f1";
            ctx.beginPath();
            ctx.moveTo(0, 380);
            ctx.lineTo(canvas.width, 380);
            ctx.stroke();
        }

        function drawDog() {
            ctx.save();
            ctx.translate(dog.x + dog.width/2, dog.y + dog.height/2);
            ctx.rotate(dog.rotation * Math.PI/180);
            ctx.drawImage(dogImg, -dog.width/2, -dog.height/2, dog.width, dog.height);
            ctx.restore();
        }

        function drawObstacles() {
            obstacles.forEach((o, index) => {
                if (index % 2 === 0) {
                    ctx.fillStyle = "red";
                } else {
                    ctx.fillStyle = "yellow";
                }
                ctx.fillRect(o.x, o.y, o.width, o.height);
            });
        }

        function updateObstacles() {
            obstacles.forEach(o => o.x -= gameSpeed);
            if (obstacles.length === 0 || obstacles[obstacles.length - 1].x < 500) {
                obstacles.push({ x: canvas.width, y: 320, width: 40, height: 60 });
            }
            obstacles = obstacles.filter(o => o.x + o.width > 0);
        }

        function checkCollision() {
            obstacles.forEach(o => {
                if (dog.x < o.x + o.width &&
                    dog.x + dog.width > o.x &&
                    dog.y < o.y + o.height &&
                    dog.y + dog.height > o.y) {
                    gameOver = true;
                }
            });
        }

        function update() {
            if (gameOver) {
                ctx.fillStyle = "red";
                ctx.font = "40px Arial Black";
                ctx.fillText("GAME OVER!", canvas.width/2 - 120, 150);

                ctx.fillStyle = "yellow";
                ctx.font = "30px Arial";
                ctx.fillText("Score: " + score, canvas.width/2 - 70, 200);

                ctx.fillStyle = "red";
                ctx.font = "20px Arial";
                ctx.fillText("Press SPACE to Restart", canvas.width/2 - 130, 250);
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dog physics
            dog.y += dog.dy;
            dog.dy += dog.gravity;

            // Rotation effect during jump
            if (dog.dy < 0) {
                dog.rotation = -15; // tilt up
            } else if (dog.dy > 2) {
                dog.rotation = 15;  // tilt down
            } else {
                dog.rotation = 0;   // neutral
            }

            if (dog.y > 320) {
                dog.y = 320;
                dog.dy = 0;
                dog.rotation = 0;
            }

            drawGround();
            drawDog();
            updateObstacles();
            drawObstacles();
            checkCollision();

            score++;
            ctx.fillStyle = "yellow";
            ctx.font = "20px Arial";
            ctx.fillText("Score: " + score, 10, 20);

            animationId = requestAnimationFrame(update);
        }

        document.addEventListener("keydown", e => {
            if (e.code === "Space") {
                if (gameOver) {
                    initGame();
                } else if (dog.y === 320) {
                    dog.dy = dog.jumpPower;
                }
            }
        });

        initGame();
    </script>
</body>
</html>
